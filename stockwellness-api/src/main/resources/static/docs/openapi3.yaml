  /api/v1/auth/exchange:
    post:
      tags:
      - Auth
      summary: OAuth 교환 코드로 토큰 발급
      description: "43자리 Base64URL code를 60초 내 한 번만 교환하며, 만료·재사용·미등록 code는 A009로 거\
        부합니다."
      operationId: auth-exchange
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRequest"
            examples:
              auth-exchange:
                value: |-
                  {
                    "code" : "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
              auth-exchange-error-a009:
                value: |-
                  {
                    "code" : "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                auth-exchange:
                  value: |-
                    {
                      "success" : true,
                      "status" : 200,
                      "code" : "S000",
                      "message" : "요청이 성공적으로 처리되었습니다.",
                      "data" : {
                        "accessToken" : "access.token.dummy",
                        "refreshToken" : "refresh.token.dummy",
                        "memberId" : 1,
                        "email" : "test@example.com",
                        "nickname" : "tester",
                        "joinedDate" : "2026-08-10"
                      },
                      "timestamp" : "2026-08-10T21:39:16.919319",
                      "errors" : [ ]
                    }
