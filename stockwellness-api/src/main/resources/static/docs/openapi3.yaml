                      "traceId" : "94333eac",
                      "errors" : [ ]
                    }
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: 로그아웃
      description: Bearer 인증이 필수이며 서버에서 리프레시 토큰을 삭제합니다. 무인증은 A001로 거부합니다.
      operationId: auth-logout
      parameters:
      - name: Authorization
        in: header
        description: Bearer Access Token
        required: true
        schema:
          type: string
        example: "Bearer {ACCESS_TOKEN}"
      responses:
        "401":
          description: "401"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                auth-logout-error-a001:
                  value: "{\"success\":false,\"status\":401,\"code\":\"A001\",\"message\"\
                    :\"인증이 필요합니다.\",\"timestamp\":\"2026-08-10T21:42:39.117405\",\"\
                    errors\":[]}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyDataResponse"
              examples:
                auth-logout:
                  value: |-
